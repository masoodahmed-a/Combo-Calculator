<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Hilal Kids – Combo Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F7F6;--card:#fff;--ink:#17343A;--mute:#6A8286;--line:#D9E6E4;--acc:#1F8A7D;--accInk:#fff;--tot:#17343A;--totInk:#fff;--warn:#C0462F}
@media(prefers-color-scheme:dark){:root{--bg:#0F1E21;--card:#172A2E;--ink:#E6F2F0;--mute:#8FA9AD;--line:#274045;--acc:#3CB5A5;--accInk:#08201D;--tot:#E6F2F0;--totInk:#0F1E21;--warn:#F08A72}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 150px}
h1{font-size:26px;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--line);color:var(--ink);font-weight:700}
button.pri{background:var(--acc);color:var(--accInk)}
button.del{color:var(--warn)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{display:grid;gap:10px}
.combo{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.combo .n{flex:1;font-weight:800;font-size:18px}
.combo .m{color:var(--mute);font-size:14px;font-weight:500}
.combo .dup{padding:8px 10px;font-size:13px}
.add{width:100%;margin-top:14px;padding:14px;font-size:17px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{padding:8px 12px}
.name{flex:1;font-size:22px;font-weight:800;border:0;background:transparent;color:var(--ink);padding:4px 0;min-width:0;border-bottom:2px solid transparent}
.name:not([disabled]){border-bottom-color:var(--acc)}
.lock{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.sw{position:relative;width:50px;height:28px;border-radius:99px;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw[aria-pressed=true]{background:var(--acc)}
.sw[aria-pressed=true]::after{transform:translateX(22px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hd,.row{display:grid;grid-template-columns:1fr 70px 108px 62px;gap:8px;align-items:center;padding:10px 12px}
.hd{color:var(--mute);font-size:13px;font-weight:700;background:var(--bg)}
.hd span:nth-child(n+2),.row .lt{text-align:right}
.row{border-top:1px solid var(--line)}
.row.off{opacity:.45}
.pn{font-weight:700;min-width:0;display:flex;gap:6px;align-items:center}
.pn input{width:100%}
.pn .x{padding:2px 8px;font-size:14px;color:var(--warn);background:transparent;flex:none}
input[type=number],input[type=text]{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed transparent;padding:4px 0;width:100%}
.row input[type=number]{text-align:right}
.row input:not([disabled]),.ex input:not([disabled]){border-bottom-color:var(--acc);background:var(--bg);border-radius:6px;padding:4px 6px}
input[disabled]{opacity:1;-webkit-text-fill-color:var(--ink)}
.step{display:flex;align-items:center;justify-content:space-between;gap:2px}
.step button{width:32px;height:32px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.step b{min-width:20px;text-align:center;font-size:17px}
.lt{font-weight:800}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.ex input{width:100px;text-align:right}
.ex.sub2{background:var(--bg)}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button{flex:1;min-width:120px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--tot);color:var(--totInk);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar small{opacity:.7;display:block;font-weight:700}
.bar .amt{font-size:34px;font-weight:800;line-height:1.1}
.bar button{background:var(--acc);color:var(--accInk)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY='alhilal_combos_v1';
const P=(n,p)=>({id:'p'+Math.random().toString(36).slice(2,8),name:n,price:p,qty:0});
const seedItems=()=>[['Muslin Zipper',313],['Cotton Jabla',40],['Dry Sheet',105],['Cap Set',55],['Muslin Knot Jabla',60],['Muslin Button Jabla',60],['Muslin Towel',115],['Own Muslin Towel',70],['Bath Towel',235],['Nappy',13],['Nail Cutter',165],['Cap Towel',100],['Ropper',150]].map(a=>P(...a));
const newCombo=n=>({id:'c'+Math.random().toString(36).slice(2,8),name:n,items:seedItems(),shipping:300,ad:100});
let S=load();
let editing=false;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.length)return d}catch(e){}return [newCombo('Combo 1'),newCombo('Combo 2'),newCombo('Combo 3')]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>=0?n:0};
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=c=>c.items.reduce((t,i)=>t+i.price*i.qty,0);
const total=c=>sub(c)+num(c.shipping)+num(c.ad);
const app=document.getElementById('app');
const cur=()=>S.find(c=>c.id===location.hash.slice(1));

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}

function home(){
  document.title='Al Hilal Kids – Combo Calculator';
  app.innerHTML=`<h1>Al Hilal Kids</h1><p class="sub">Pick a combo to calculate the customer’s price</p>
  <div class="list">${S.map(c=>`<div class="combo" data-open="${c.id}" tabindex="0" role="button">
    <div><div class="n">${esc(c.name)}</div><div class="m">${c.items.filter(i=>i.qty>0).length} items selected</div></div><span style="flex:1"></span>
    <div class="n" style="flex:none">${fmt(total(c))}</div>
    <button class="dup" data-dup="${c.id}" aria-label="Duplicate combo">Copy</button></div>`).join('')||'<div class="empty">No combos yet.</div>'}</div>
  <button class="pri add" id="add">+ New combo</button>`;
  app.querySelectorAll('[data-open]').forEach(e=>{e.onclick=()=>location.hash=e.dataset.open;e.onkeydown=ev=>{if(ev.key==='Enter')e.click()}});
  app.querySelectorAll('[data-dup]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const c=S.find(x=>x.id===b.dataset.dup);const d=JSON.parse(JSON.stringify(c));d.id='c'+Math.random().toString(36).slice(2,8);d.name=c.name+' copy';S.push(d);save();home()});
  document.getElementById('add').onclick=()=>{S.push(newCombo('Combo '+(S.length+1)));save();home()};
}

function combo(c){
  document.title=c.name;
  const dis=editing?'':'disabled';
  app.innerHTML=`<div class="top"><button class="back" id="back" aria-label="Back">‹ Back</button>
    <input class="name" id="cname" type="text" value="${esc(c.name)}" ${dis}>
    <div class="lock"><span>Edit</span><button class="sw" id="sw" aria-pressed="${editing}" aria-label="Edit prices"></button></div></div>
  <div class="card"><div class="hd"><span>Product</span><span>Price</span><span style="text-align:center">Qty</span><span>Total</span></div>
  ${c.items.map((i,k)=>`<div class="row ${i.qty?'':'off'}" data-k="${k}">
    <div class="pn">${editing?`<button class="x" data-x="${k}" aria-label="Remove">✕</button>`:''}<input type="text" data-f="name" value="${esc(i.name)}" ${dis}></div>
    <input type="number" inputmode="decimal" min="0" data-f="price" value="${i.price}" ${dis}>
    <div class="step"><button data-m="-1" aria-label="Less">−</button><b>${i.qty}</b><button data-m="1" aria-label="More">+</button></div>
    <div class="lt">${fmt(i.price*i.qty)}</div></div>`).join('')}
  <div class="ex sub2"><span><b>Items total</b></span><b id="sub">${fmt(sub(c))}</b></div>
  <div class="ex"><span>Shipping</span><input type="number" inputmode="decimal" min="0" id="ship" value="${c.shipping}" ${dis}></div>
  <div class="ex"><span>Ad</span><input type="number" inputmode="decimal" min="0" id="ad" value="${c.ad}" ${dis}></div></div>
  <div class="tools">${editing?'<button id="addp">+ Add product</button><button class="del" id="delc">Delete combo</button>':'<button id="reset">Reset all qty to 0</button>'}</div>
  <div class="bar"><div class="in"><div><small>Final price</small><div class="amt" id="tot">${fmt(total(c))}</div></div><button id="copy">Copy bill</button></div></div>`;

  const upd=()=>{save();app.querySelector('#tot').textContent=fmt(total(c));app.querySelector('#sub').textContent=fmt(sub(c));
    app.querySelectorAll('.row').forEach(r=>{const i=c.items[r.dataset.k];r.querySelector('.lt').textContent=fmt(i.price*i.qty);r.querySelector('b').textContent=i.qty;r.classList.toggle('off',!i.qty)})};
  app.querySelector('#back').onclick=()=>{location.hash=''};
  app.querySelector('#sw').onclick=()=>{editing=!editing;combo(c)};
  app.querySelector('#cname').oninput=e=>{c.name=e.target.value;save()};
  app.querySelectorAll('.row').forEach(r=>{const i=c.items[r.dataset.k];
    r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{i.qty=Math.max(0,i.qty+Number(b.dataset.m));upd()});
    r.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{if(inp.dataset.f==='name')i.name=inp.value;else i.price=num(inp.value);upd()})});
  app.querySelector('#ship').oninput=e=>{c.shipping=num(e.target.value);upd()};
  app.querySelector('#ad').oninput=e=>{c.ad=num(e.target.value);upd()};
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{c.items.splice(b.dataset.x,1);save();combo(c)});
  const ap=app.querySelector('#addp');if(ap)ap.onclick=()=>{c.items.push(P('New product',0));save();combo(c)};
  const dc=app.querySelector('#delc');if(dc)dc.onclick=()=>{if(confirm('Delete "'+c.name+'"?')){S=S.filter(x=>x!==c);save();location.hash=''}};
  const rs=app.querySelector('#reset');if(rs)rs.onclick=()=>{c.items.forEach(i=>i.qty=0);upd()};
  app.querySelector('#copy').onclick=()=>{
    const L=c.items.filter(i=>i.qty>0).map(i=>`${i.name} x${i.qty} = ${fmt(i.price*i.qty)}`);
    L.push('Shipping = '+fmt(num(c.shipping)));if(num(c.ad))L.push('Ad = '+fmt(num(c.ad)));L.push('Final price = '+fmt(total(c)));
    const t=L.join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Bill copied'),()=>{prompt('Copy this bill:',t)});
  };
}

function route(){const c=cur();if(c)combo(c);else{editing=false;home()}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
